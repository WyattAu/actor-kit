# WyattAu dependency governance — cargo-deny configuration.
# Copy to the repo root. Policies: see engineering-standards README §7.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # bincode 1.x unmaintained (not a vulnerability). Two entry points: the
    # optional direct dep behind the `serde` feature (message framing) and a
    # transitive via iai-callgrind (dev benches). No in-range fix; bincode 2
    # is a semver-major API migration, not reachable by a lock bump.
    # TODO: migrate the `serde` feature to bincode 2, then drop this ignore.
    "RUSTSEC-2025-0141",
    # proc-macro-error2 unmaintained (not a vulnerability). Dev-only: via
    # iai-callgrind-macros <- iai-callgrind. No safe upgrade available.
    # TODO: drop when iai-callgrind migrates to a maintained diagnostics crate.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
