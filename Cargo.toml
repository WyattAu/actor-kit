[package]
name = "actor-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Work-stealing actor runtime with OTP-style supervision trees, crossbeam work-stealing scheduling, and bounded mailbox backpressure"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/actor-kit"
homepage = "https://github.com/WyattAu/actor-kit"
documentation = "https://docs.rs/actor-kit"
readme = "README.md"
keywords = ["actor", "supervision", "work-stealing", "erlang", "concurrency"]
categories = ["concurrency", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
crossbeam-deque = "0.8"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
parking_lot = "0.12"
dashmap = "6.1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
lru = "0.12"
serde = { version = "1", features = ["derive"], optional = true }
async-trait = { version = "0.1", optional = true }
bincode = { version = "1.3", optional = true }
rkyv = { version = "0.8", features = ["bytecheck"], optional = true }

[dev-dependencies]
proptest = "1"
criterion = "0.5"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[features]
default = ["std"]
# std passthrough: the runtime is std-based; kept so dependents can express
# `default-features = false, features = ["std"]` uniformly.
std = []
# Typed RPC (`rpc` module), serde impls on public types, wire serialization.
serde = ["dep:serde", "dep:async-trait", "dep:bincode"]
# Zero-copy message path via rkyv (`zero_copy` module).
zero-copy = ["dep:rkyv"]
# Bump-allocator memory pool (`memory_pool` module).
#
# LOUD WARNING: this module contains `unsafe` code (raw-pointer arena,
# hand-rolled free list, manual `Send`/`Sync` impls). The crate otherwise
# carries `#![deny(unsafe_code)]`; this feature opts into the one exception.
# Every block carries SAFETY comments. Review before enabling.
unsafe-pool = []
# Everything above.
full = ["serde", "zero-copy", "unsafe-pool"]

[[bench]]
name = "spawn_throughput"
harness = false

[[bench]]
name = "message_roundtrip"
harness = false

[[bench]]
name = "steal_contention"
harness = false

[profile.bench]
debug = true
