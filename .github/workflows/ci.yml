name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@main
    with:
      tier: b
      all-features: true
      loom: false
      wasm: false
      miri: false
      bench-regression: true  # drain stall fixed in 0.1.1 (mailbox permits released on consumption); both benches run clean — see PERF-SLO.md
